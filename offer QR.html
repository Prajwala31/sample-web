<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exclusive Offer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1553621042-f6e147245754') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.75);
      padding: 40px 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 500px;
      color: #fff;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }

    .overlay h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    .overlay p {
      font-size: 1.2rem;
      color: #f1c40f;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    #qrcode {
      margin: 0 auto;
      width: fit-content;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Exclusive Offer!</h1>
    <p>Get over <strong>30% OFF</strong> your order and a <strong>FREE dessert!</strong><br>
    Scan the QR code to order through our website.</p>
    <div id="qrcode"></div>
  </div>

  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://yourdomain.com/index.html", // Replace with your real URL
      width: 180,
      height: 180,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
